name: Build & deploy catalog (every 6 hours)

# ------------------------------------------------------------
# Fully automatic: no manual build, no manual deploy.
#   - runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
#   - also runs on every push to main/master, so new share
#     links appear immediately instead of waiting for the cron
#   - validates the JS, rebuilds site/data/catalog.json from
#     data/shares.txt, rebuilds the full site from web/
#   - auto-commits the regenerated site/ folder
#   - deploys site/ to GitHub Pages
#
# One-time repo setup:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# ------------------------------------------------------------
on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-catalog
  cancel-in-progress: false

jobs:
  build:
    name: Build catalog + website
    # Avoid an endless loop when the auto-commit bot pushes the rebuilt site.
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Syntax check
        run: node --check extension/common.js && node --check extension/popup.js && node --check extension/viewer.js && node --check extension/content-pdp.js && node --check extension/content-seller.js && node --check extension/background.js && node --check scripts/build-catalog.mjs && node --check web/app.js && node --check web/sw.js

      - name: Build site + catalog from data/shares.txt
        run: node scripts/build-catalog.mjs

      - name: Validate generated catalog
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('site/data/catalog.json','utf8')); if(!Array.isArray(c.products)) throw new Error('catalog.products missing'); if(c.count!==c.products.length) throw new Error('catalog count mismatch'); console.log('catalog OK:', c.products.length, 'products');"
          test -f site/index.html
          test -f site/app.js
          test -f site/viewer.html
          test -f site/data/catalog.json

      - name: Auto commit regenerated site
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No catalog changes - nothing to commit."
            exit 0
          fi
          git commit -m "chore: auto rebuild share catalog [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Catalog pushed on attempt ${attempt}."
              exit 0
            fi
            sleep 3
          done
          echo "Catalog push skipped after 3 attempts (another push won the race)."
          exit 0

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
